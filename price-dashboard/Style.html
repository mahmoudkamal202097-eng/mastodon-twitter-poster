<style>
:root{
  --bg:#0a0c09; --bg2:#0f120d; --surface:#141811; --surface2:#1a1f15; --surface3:#21271a;
  --line:#242b1d; --line2:#1b2116;
  --text:#eef3e6; --muted:#a7b09a; --faint:#707a62;
  --lime:#c6f432; --lime-d:#a8d21c; --lime-bg:rgba(198,244,50,.10); --on-lime:#12180a;
  --only:#4fd6c4; --only-bg:rgba(79,214,196,.12);
  --same:#8db4ff; --same-bg:rgba(141,180,255,.12);
  --cheap:#9be33a; --cheap-bg:rgba(155,227,58,.12);
  --pricey:#ff6a7a; --pricey-bg:rgba(255,106,122,.12);
  --other:#6f7864; --other-bg:rgba(111,120,100,.18);
  --warn:#f5b84a; --warn-bg:rgba(245,184,74,.13);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 30px -18px rgba(0,0,0,.8);
  --radius:16px; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --bg:#f3f5ee; --bg2:#eceee4; --surface:#ffffff; --surface2:#f7f9f1; --surface3:#eef1e4;
  --line:#e0e5d2; --line2:#eaeedd; --text:#151a0e; --muted:#566046; --faint:#8a947a;
  --lime:#7fb800; --lime-d:#6aa000; --lime-bg:rgba(127,184,0,.12); --on-lime:#fff;
  --only:#0b9b8a; --only-bg:rgba(11,155,138,.1); --same:#3b6fd8; --same-bg:rgba(59,111,216,.1);
  --cheap:#3f9a07; --cheap-bg:rgba(63,154,7,.1); --pricey:#d62f45; --pricey-bg:rgba(214,47,69,.1);
  --other:#7c8570; --other-bg:rgba(124,133,112,.15); --warn:#b27407; --warn-bg:rgba(178,116,7,.12);
  --shadow:0 1px 2px rgba(20,26,10,.05),0 10px 24px -14px rgba(20,26,10,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic','Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:14.5px;line-height:1.55;
  background-image:radial-gradient(1200px 500px at 85% -10%,rgba(198,244,50,.07),transparent 60%),radial-gradient(900px 400px at 0% 0%,rgba(79,214,196,.05),transparent 55%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--lime);text-decoration:none}a:hover{text-decoration:underline}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
div.num{display:block}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:8px}
svg{flex:none}
[hidden]{display:none!important}

/* ===== header ===== */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1560px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.3px}
.logo .mark{width:36px;height:36px;border-radius:11px;background:var(--lime);display:grid;place-items:center;color:var(--on-lime);box-shadow:0 8px 22px -8px var(--lime)}
.logo small{display:block;font-weight:500;font-size:11.5px;color:var(--faint);margin-top:-4px;letter-spacing:0}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-inline-start:10px}
.nav button{background:none;border:0;border-radius:10px;padding:7px 16px;cursor:pointer;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;transition:.15s}
.nav button:hover{color:var(--text)}
.nav button[aria-selected="true"]{background:var(--lime);color:var(--on-lime)}
.badge{background:var(--pricey);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;min-width:20px;text-align:center;font-weight:700;line-height:18px}
.nav button[aria-selected="true"] .badge{background:var(--on-lime);color:var(--lime)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--lime);color:var(--lime)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.btn.primary:hover{filter:brightness(1.07);color:var(--on-lime)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.btn.icon{padding:8px 10px}
.btn[disabled]{opacity:.55;cursor:progress}
.spin{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:none}
.busy .spin{display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.pillbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
.pillbar .bar{width:110px;height:6px;border-radius:99px;background:var(--surface3);overflow:hidden}
.pillbar .bar i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .6s}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,244,50,.5)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ===== layout ===== */
main{max-width:1560px;margin:0 auto;padding:22px 24px 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.card-h h2{margin:0;font-size:15px;font-weight:700}
.card-h .sub{color:var(--faint);font-size:12.5px}
.grid{display:grid;gap:16px}
.sec-t{font-size:12.5px;font-weight:700;letter-spacing:.4px;color:var(--faint);text-transform:uppercase;margin:24px 2px 10px}
.view[hidden]{display:none}

/* ===== overview ===== */
.g-info{grid-template-columns:repeat(5,minmax(0,1fr))}
.info{padding:14px 16px}
.info .k{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:7px}
.info .v{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-top:4px;line-height:1.2}
.info .v small{font-size:13px;color:var(--faint);font-weight:500;margin-inline-start:6px}
.info .meter{height:6px;border-radius:99px;background:var(--surface3);margin-top:10px;overflow:hidden}
.info .meter i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .6s}
.g-pos{grid-template-columns:repeat(4,minmax(0,1fr))}
.pos{position:relative;padding:20px 20px 18px;cursor:pointer;text-align:start;overflow:hidden;border:1px solid var(--line);transition:.18s;display:block;width:100%}
.pos:hover{transform:translateY(-3px);border-color:var(--c)}
.pos::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--c)}
.pos::after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--c);opacity:.08}
.pos .t{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--c)}
.pos .big{display:block;font-size:46px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:10px 0 4px}
.pos .d{color:var(--muted);font-size:13px;display:block;direction:rtl;text-align:left;padding-inline-end:46px;line-height:1.5}
.pos .pct{position:absolute;inset-inline-end:16px;top:18px;font-size:13px;color:var(--faint)}
.g-two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);margin-top:16px}
.g-two.b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.gaps{list-style:none;margin:0;padding:4px 10px 12px}
.gap-i{display:grid;grid-template-columns:28px 44px 1fr auto;gap:12px;align-items:center;padding:9px 8px;border-radius:12px;cursor:pointer}
.gap-i:hover{background:var(--surface2)}
.gap-i .rk{color:var(--faint);font-size:12.5px;font-weight:700;text-align:center}
.gap-i b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gap-i .m{min-width:0} .gap-i .m span{font-size:12.5px;color:var(--muted)}
.gap-i .r{text-align:end}
.gap-pct{color:var(--pricey);font-weight:700;font-size:15px}
.thumb{width:44px;height:44px;border-radius:11px;background:var(--surface3) center/cover no-repeat;border:1px solid var(--line);flex:none}
.empty{padding:34px 18px;text-align:center;color:var(--faint)}
.chart-box{padding:4px 18px 18px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:0 18px 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.cbar{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;margin:9px 0;cursor:pointer}
.cbar:hover .nm{color:var(--lime)}
.cbar .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface3);gap:2px}
.cbar .bar span{display:block;min-width:3px}
.cbar .ct{font-size:12.5px;color:var(--faint);text-align:end}

.ar{font-family:'IBM Plex Sans Arabic','Cairo','Segoe UI',Tahoma,sans-serif;direction:rtl;unicode-bidi:isolate;display:inline-block;font-size:.97em}
.sec-t .ar,.card-h .sub .ar{letter-spacing:0;text-transform:none}
.empty .ar,.hint .ar,.info .ar,.pos .ar{color:var(--muted)}

/* ===== pills ===== */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.only_us{background:var(--only-bg);color:var(--only)}
.pill.same{background:var(--same-bg);color:var(--same)}
.pill.cheaper{background:var(--cheap-bg);color:var(--cheap)}
.pill.pricier{background:var(--pricey-bg);color:var(--pricey)}
.pill.not_checked{background:var(--other-bg);color:var(--muted)}
.pill.needs_help{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--cheap-bg);color:var(--cheap)} .pill.oos{background:var(--other-bg);color:var(--muted)}

/* ===== products ===== */
.cats{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px 0}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);transition:.15s}
.cat:hover{border-color:var(--lime);color:var(--text)}
.cat[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.cat em{font-style:normal;opacity:.7;margin-inline-start:7px;font-size:12px}
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px}
.search{position:relative;flex:1;min-width:230px;max-width:440px}
.search input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 38px 9px 12px;outline:none}
[dir="rtl"] .search input{padding:9px 12px 9px 38px}
.search input:focus{border-color:var(--lime);box-shadow:0 0 0 3px var(--lime-bg)}
.search svg{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.sel{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;max-width:210px}
.sel option{background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px;transition:.15s}
.chip:hover{border-color:var(--c,var(--lime))}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--lime)) 16%,transparent);border-color:var(--c,var(--lime));color:var(--c,var(--lime))}
.chip em{font-style:normal;opacity:.8;font-size:12px}
.tbl-wrap{overflow:auto;border-top:1px solid var(--line);max-height:calc(100vh - 290px);min-height:240px}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
table.t th{position:sticky;top:0;z-index:3;background:var(--surface2);font-size:12px;color:var(--faint);font-weight:700;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
table.t th button:hover,table.t th .on{color:var(--lime)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
table.t tr:hover td{background:var(--surface2)}
table.t td.c-prod,table.t th.c-prod{position:sticky;inset-inline-start:0;z-index:2;background:var(--surface);min-width:300px;max-width:340px;white-space:normal;box-shadow:inset -1px 0 0 var(--line2)}
[dir="rtl"] table.t td.c-prod,[dir="rtl"] table.t th.c-prod{box-shadow:inset 1px 0 0 var(--line2)}
table.t th.c-prod{z-index:4;background:var(--surface2)}
table.t tr:hover td.c-prod{background:var(--surface2)}
.prod{display:flex;gap:12px;align-items:center;cursor:pointer}
.prod .tt{min-width:0}
.prod b{display:block;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod span{font-size:12px;color:var(--faint)}
.grp-row td{background:var(--bg2)!important;font-size:11.5px;font-weight:700;color:var(--faint);letter-spacing:.4px;padding:6px 12px;text-transform:uppercase}
.price{font-weight:700}
.gp{font-weight:700}
.gp.up{color:var(--pricey)} .gp.down{color:var(--cheap)} .gp.eq{color:var(--same)}
.cp{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 8px;font-family:var(--mono);font-weight:600;color:var(--text)}
a.cp:hover{text-decoration:none;background:var(--surface3)}
.cp.best{background:var(--cheap-bg);color:var(--cheap);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cheap) 40%,transparent)}
.cp.oos{color:var(--faint);text-decoration:line-through;opacity:.75}
.cp.low{color:var(--warn);background:var(--warn-bg);font-family:inherit;font-size:12px}
.dash{color:var(--faint)}
.ico{opacity:.7}
.row-act{display:flex;gap:6px;justify-content:flex-end}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;flex-wrap:wrap}
.pager .pn{display:flex;gap:6px;align-items:center}
.stale{font-size:11px;color:var(--warn);margin-inline-start:6px}

/* ===== drawer / modal ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(640px,100vw);background:var(--surface);border-inline-start:1px solid var(--line);z-index:61;transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.7)}
[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer.show{transform:none}
.dr-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.dr-h .thumb{width:64px;height:64px;border-radius:14px}
.dr-h h3{margin:0 0 4px;font-size:16px;line-height:1.4}
.dr-b{padding:18px 20px;overflow:auto;flex:1;display:grid;gap:16px;align-content:start}
.box{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h4{margin:0 0 10px;font-size:12.5px;color:var(--faint);font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.kvs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kvs div{background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.kvs small{display:block;color:var(--faint);font-size:12px}
.kvs b{font-size:18px}
table.off{width:100%;border-collapse:collapse;font-size:13.5px}
table.off th{font-weight:600;color:var(--faint);font-size:12px;text-align:start;padding:4px 8px}
table.off td{padding:9px 8px;border-top:1px solid var(--line2);vertical-align:middle}
table.off tr.best td{background:var(--cheap-bg)}
.modal{position:fixed;inset-inline:0;top:8vh;margin:0 auto;width:min(520px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--line);border-radius:18px;z-index:70;padding:22px;box-shadow:0 40px 80px -30px #000;opacity:0;pointer-events:none;transform:translateY(12px);transition:.2s}
.modal.show{opacity:1;pointer-events:auto;transform:none}
.modal h3{margin:0 0 4px;font-size:17px}
.modal p{margin:0 0 14px;color:var(--muted);font-size:13px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--lime);box-shadow:0 0 0 3px var(--lime-bg)}
.fld textarea{resize:vertical;min-height:64px}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.hint{font-size:12.5px;color:var(--muted);margin-top:-4px;margin-bottom:10px}
.ok-t{color:var(--cheap)} .err-t{color:var(--pricey)}

/* ===== alerts ===== */
.al-list{list-style:none;margin:0;padding:6px 10px 14px}
.al{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:11px 10px;border-radius:12px;cursor:pointer;border-bottom:1px solid var(--line2)}
.al:hover{background:var(--surface2)}
.al.unread{background:linear-gradient(90deg,var(--lime-bg),transparent)}
.al .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--surface3)}
.al .ic.competitor_cheaper{background:var(--pricey-bg);color:var(--pricey)} .al .ic.price_drop{background:var(--cheap-bg);color:var(--cheap)}
.al .ic.price_rise{background:var(--warn-bg);color:var(--warn)} .al .ic.new_match{background:var(--same-bg);color:var(--same)} .al .ic.back_in_stock{background:var(--only-bg);color:var(--only)}
.al b{font-weight:600} .al .m span{font-size:12.5px;color:var(--muted)}
.al time{font-size:12px;color:var(--faint);white-space:nowrap}
.dotun{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-inline-end:6px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--lime);color:var(--on-lime);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:90;font-weight:700;max-width:90vw}
.toast.err{background:var(--pricey);color:#fff}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sk{background:linear-gradient(90deg,var(--surface),var(--surface3),var(--surface));background-size:200% 100%;animation:sk 1.3s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
.errbox{max-width:640px;margin:70px auto;text-align:center;padding:30px}
.errbox code{direction:ltr;display:block;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:14px 0;font-family:var(--mono);font-size:12.5px;color:var(--pricey);text-align:left;white-space:pre-wrap}
.foot{color:var(--faint);font-size:12.5px;text-align:center;margin-top:30px}

@media (max-width:1180px){
  .g-info{grid-template-columns:repeat(3,minmax(0,1fr))}.g-pos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-two,.g-two.b{grid-template-columns:1fr}
}
@media (max-width:720px){
  main{padding:16px 14px 80px}.top-in{padding:10px 14px}
  .g-info{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pos .big{font-size:36px}
  .nav{order:5;width:100%;margin:0}.nav button{flex:1;justify-content:center;padding:8px 6px}
  .hide-s{display:none}
  table.t td.c-prod,table.t th.c-prod{min-width:220px;max-width:240px}
  .tbl-wrap{max-height:none}
  .kvs{grid-template-columns:1fr 1fr}
  .cbar{grid-template-columns:90px 1fr 36px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
